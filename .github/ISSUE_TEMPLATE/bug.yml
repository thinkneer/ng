name: Bug or wrong answer
description: Something broken on the site, or an answer you think is wrong.
title: "[bug] <where> · <what>"
labels: ["request", "bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where (page link or subject/chapter/question id)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should happen?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone / browser (optional)
      placeholder: "iPhone Safari, Android Chrome, PC Edge"
