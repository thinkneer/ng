name: Access request
description: Ask for a nickname account (progress sync). Use a nickname — everything saved on the site is public.
title: "[access] <nickname>"
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        **Use a nickname, not your name.** Don't add your email, phone, school or city. Everything you save on this site is public.
        The site's "Request access" page fills this form for you (the passphrase never leaves your browser — only a salted hash is sent).
  - type: input
    id: nickname
    attributes:
      label: Nickname
      description: 3–20 characters, letters, digits and _ only
    validations:
      required: true
  - type: input
    id: class
    attributes:
      label: Class and stream
      placeholder: "12 science"
    validations:
      required: true
  - type: input
    id: subjects
    attributes:
      label: Subjects
      placeholder: "physics, chemistry, maths, english-core"
    validations:
      required: true
  - type: textarea
    id: credential
    attributes:
      label: Credential block (generated by the site)
      description: Paste exactly what the Request access page gave you. It contains the salt and hash, never the passphrase.
      render: json
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: GitHub username (optional, needed for "Sync to site")
