name: Screenshots (Chromium + WebKit)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'styles/**'
      - 'index.html'
      - 'tests/screenshots.mjs'

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx --yes playwright@1.49.1 install --with-deps chromium webkit
      - run: npm install --no-save playwright@1.49.1
      - name: Serve and screenshot
        run: |
          node scripts/serve.mjs 4173 & sleep 1
          BROWSERS=chromium,webkit node tests/screenshots.mjs http://localhost:4173/ng/
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "docs: refresh screenshots [skip ci]" && git push
          fi
